<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <script>
  (function(){
    try {
      document.documentElement.setAttribute('data-accent', localStorage.getItem('oson_accent') || 'green');
    } catch (e) {}
  })();
  </script>
  <!-- Zoom ataylab bloklanmaydi: mijozlarning bir qismi yoshi katta va matnni
       kattalashtirib o'qiydi. "Nativ ilova" hissi uchun ularni yo'qotish arzimaydi. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script>
  // Brauzerdagi xatolarni o'z serverimizga yuboramiz. Bu skript boshqa
  // hamma narsadan oldin turadi — shuning uchun ilova yuklanayotganda yuz
  // bergan xatolarni ham tutadi. Uchinchi tomon xizmati ishlatilmaydi.
  (function () {
    var MAX = 8;            // bitta sessiyada eng ko'pi bilan shuncha xabar
    var sent = 0;
    var seen = {};          // bir xil xato takror yuborilmaydi

    function base() {
      var h = location.hostname;
      if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:3001';
      if (h.indexOf('test.') === 0 || h.indexOf('staging.') === 0) return 'https://api-test.osugurta.uz';
      return 'https://api.osugurta.uz';
    }

    function report(d) {
      try {
        if (sent >= MAX) return;
        var key = (d.message || '') + '|' + (d.line || '');
        if (!key.replace('|', '') || seen[key]) return;
        seen[key] = 1; sent++;

        try {
          var u = JSON.parse(localStorage.getItem('oson_client_user') || 'null');
          if (u && u.phone) d.phone = u.phone;
        } catch (e) {}
        d.page = location.hash || '/';

        var url = base() + '/api/client-errors';
        var body = JSON.stringify(d);
        // sendBeacon sahifa yopilayotganda ham yetib boradi
        if (navigator.sendBeacon) {
          navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }));
        } else {
          fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(function () {});
        }
      } catch (e) {}
    }

    window.addEventListener('error', function (e) {
      if (!e) return;
      // Rasm/skript yuklanmaganda ham shu hodisa keladi — uni ajratamiz
      if (e.target && e.target !== window && e.target.tagName) {
        return report({ kind: 'error', message: 'Yuklanmadi: ' + e.target.tagName, source: e.target.src || e.target.href || '' });
      }
      report({
        kind: 'error',
        message: e.message || 'Noma\'lum xato',
        source: e.filename || '',
        line: e.lineno || 0,
        col: e.colno || 0,
        stack: (e.error && e.error.stack) || '',
      });
    }, true);

    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      report({
        kind: 'promise',
        message: (r && (r.message || String(r))) || 'Javobsiz promise',
        stack: (r && r.stack) || '',
      });
    });
  })();
  </script>

<body>

  <!-- Skriptlar `defer` bilan: brauzer HTML'ni to'xtatmasdan o'qib boradi va
       fayllarni parallel yuklaydi. Bajarilish tartibi saqlanadi, hammasi
       DOMContentLoaded'dan oldin tugaydi — shuning uchun App.init() xavfsiz. -->
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="js/config.js?v=7"></script>
  <script defer src="js/i18n.js?v=7"></script>
  <script defer src="js/api.js?v=7"></script>
  <script defer src="js/ui.js?v=7"></script>
  <script defer src="js/app.js?v=7"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    App.init();

    // Service worker statik fayl yangilanganini aniqlasa — mijozga aytamiz.
    // Majburan qayta yuklamaydik: foydalanuvchi ariza to'ldirayotgan bo'lishi mumkin.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (!e.data || e.data.type !== 'OSON_UPDATE') return;
        if (document.querySelector('.upd-bar')) return;
        var bar = document.createElement('div');
        bar.className = 'upd-bar';
        bar.innerHTML = '<span>Yangi versiya tayyor</span>';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'Yangilash';
        btn.addEventListener('click', function () { location.reload(); });
        bar.appendChild(btn);
        document.body.appendChild(bar);
        requestAnimationFrame(function () { bar.classList.add('on'); });
      });
    }
  });
  </script>
</body>
